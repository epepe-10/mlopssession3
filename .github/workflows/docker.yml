name: docker

# when to run: on every push to main, or by hand from the Actions tab
on:
  push:
    branches: [main]
  workflow_dispatch:

# allow this workflow to publish images to GitHub's registry (ghcr.io)
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest   # the machine GitHub lends us
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
